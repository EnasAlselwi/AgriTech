<div class="absolute left-3 flex items-center pointer-events-none text-outline-variant">

<!-- Field 2: Email -->

<div class="absolute left-3 flex items-center pointer-events-none text-outline-variant">
<span class="material-symbols-outlined text-[20px]">alternate_email</span>

</div>
</div>
<!-- Field 3: Password -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="password">

<input class="w-full h-13 py-3 pr-4 pl-12 bg-transparent text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl outline-none" id="password" placeholder="أدخل كلمة المرور" required="" type="password">
<button aria-label="إظهار كلمة المرور" class="absolute left-3 w-8 h-8 flex items-center justify-center text-outline hover:text-primary transition-colors" onclick="togglePasswordVisibility('password', 'pwd-toggle-icon')" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-toggle-icon">visibility</span>
</button>
</div>
<!-- Compact Inline Helper Text -->

</div>
<!-- Field 4: Confirm Password -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="confirm-password">
<span class="">تأكيد كلمة المرور</span>

</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl focus-within:bg-surface-container-lowest focus-within:ring-2 focus-within:ring-primary-container/20 transition-all">
<input class="w-full h-13 py-3 pr-4 pl-12 bg-transparent text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl outline-none" id="confirm-password" placeholder="أعد إدخال كلمة المرور" required="" type="password">
<button aria-label="إظهار تأكيد كلمة المرور" class="absolute left-3 w-8 h-8 flex items-center justify-center text-outline hover:text-primary transition-colors" onclick="togglePasswordVisibility('confirm-password', 'confirm-pwd-toggle-icon')" type="button">
<span class="material-symbols-outlined text-[20px]" id="confirm-pwd-toggle-icon">visibility</span>
</button>
</div>
<p class="font-body-sm text-[12px] text-on-surface-variant pr-1 pt-0.5">8 أحرف على الأقل، مع حرف كبير وحرف صغير ورقم.</p></div>
<!-- Primary CTA Button (Green #31691D, Icon strictly on the LEFT side) -->
<button class="w-full h-13 py-3.5 mt-2 bg-[#31691D] hover:bg-primary active:scale-[0.99] text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-between px-5 shadow-md hover:shadow-lg transition-all" type="submit"><span class="flex items-center justify-center gap-2 w-full"><span class="font-bold">إنشاء حساب</span><span class="material-symbols-outlined text-[22px]">person_add</span></span></button>
</form>
<!-- Divider -->
<div class="flex items-center gap-3 my-5">
<div class="h-px flex-1 bg-surface-container-highest"></div>
<span class="font-label-sm text-label-sm text-outline">أو أنشئ حسابك باستخدام</span>
<div class="h-px flex-1 bg-surface-container-highest"></div>
</div>
<!-- Social Buttons -->
<div class="flex flex-col gap-3">
<button class="w-full h-12 bg-surface-container-low hover:bg-surface-container active:scale-[0.98] rounded-xl flex items-center justify-center gap-3 transition-all border border-outline-variant/30 text-on-surface font-label-md text-label-md" onclick="showToast('جاري المتابعة باستخدام Google...', 'sync')" type="button">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span class="">المتابعة باستخدام Google</span>

<!-- Notification Toast -->
<div class="fixed bottom-6 inset-x-margin z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none" id="action-toast">
<div class="bg-inverse-surface text-inverse-on-surface px-4 py-3.5 rounded-xl shadow-xl flex items-center justify-between">
<div class="flex items-center gap-2.5">
<span class="material-symbols-outlined text-inverse-primary text-[22px]" id="toast-icon">check_circle</span>
<span class="font-body-md text-body-md" id="toast-text">تم إنشاء الحساب بنجاح!</span>
</div>
<button class="text-inverse-on-surface/70 hover:text-inverse-on-surface" onclick="hideToast()">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
</div>
</div>
<script>
      function togglePasswordVisibility(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === 'password') {
          input.type = 'text';
          icon.textContent = 'visibility_off';
        } else {
          input.type = 'password';
          icon.textContent = 'visibility';
        }
      }

      function handleRegistration() {
        const pwd = document.getElementById('password').value;
        const confirm = document.getElementById('confirm-password').value;
        if (pwd !== confirm) {
          showToast('كلمتا المرور غير متطابقتين', 'lock_reset');
          return;
        }
        showToast('تم إنشاء حسابك بنجاح! مرحباً بك في AgriTech', 'check_circle');
      }

      function showToast(message, iconName) {
        const toast = document.getElementById('action-toast');
        const toastText = document.getElementById('toast-text');
        const toastIcon = document.getElementById('toast-icon');
        toastText.textContent = message;
        toastIcon.textContent = iconName;
        toast.classList.remove('translate-y-24', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
        setTimeout(() => {
          hideToast();
        }, 3500);
      }

      function hideToast() {
        const toast = document.getElementById('action-toast');
        toast.classList.add('translate-y-24', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }
    </script>
</main>
